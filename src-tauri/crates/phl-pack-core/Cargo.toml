[package]
name = "phl-pack-core"
version = "0.1.0"
description = "The .phlpack format: schema, validator, integrity, builder and unpack. Shared by the PHL desktop app and the phl-pack CLI (development spec §15)."
authors = ["dsh-phl"]
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
