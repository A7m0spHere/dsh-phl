[package]
name = "phl-pack-cli"
version = "0.1.0"
description = "The `phl-pack` command-line tool: inspect / validate / unpack / build .phlpack archives on top of phl-pack-core (development spec §15, §30 P2-1)."
authors = ["dsh-phl"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "phl-pack"
path = "src/main.rs"

[dependencies]
phl-pack-core = { path = "../phl-pack-core" }
serde_json = "1"
