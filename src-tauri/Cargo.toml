[package]
name = "dsh-phl"
version = "0.1.0"
description = "PHL — DSH Instance & Runtime Manager"
authors = ["dsh-phl"]
edition = "2021"
rust-version = "1.77.2"

# The desktop binary is a thin shell around `lib.rs`; keeping the logic in a
# library keeps the door open for the mobile entry point and for unit tests.
[lib]
name = "dsh_phl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
