[package]
name = "dsh-phl"
version = "0.1.0"
description = "PHL — DSH Instance & Runtime Manager"
authors = ["dsh-phl"]
edition = "2021"
rust-version = "1.77.2"

# The desktop binary is a thin shell around `lib.rs`; keeping the logic in a
# library keeps the door open for the mobile entry point and for unit tests.
[lib]
name = "dsh_phl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 实例 dsh-home/settings.yaml 的读-合并-写（api_config）
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
futures-util = "0.3"
tar = "0.4"
flate2 = "1"
# Node 的 Windows 发行包是 .zip（其余平台是 .tar.gz），运行时安装两边都要能解。
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
semver = "1"
dirs = "5"
fs2 = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
