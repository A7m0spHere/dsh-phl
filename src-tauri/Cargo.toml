[package]
name = "dsh-phl"
version = "0.1.0-alpha.3"
description = "PHL — DSH Instance & Runtime Manager"
authors = ["dsh-phl"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# This manifest is the Cargo workspace root (P2-1): the desktop crate plus the
# extracted Pack Core and its CLI share one lockfile and one `target/` dir.
# The root deliberately sits here, not at the repository root, so the existing
# packaging paths (`src-tauri/target/release/bundle`, build-app.cmd) are
# untouched by the extraction.
[workspace]
resolver = "2"
members = ["crates/phl-pack-core", "crates/phl-pack-cli"]

# The desktop binary is a thin shell around `lib.rs`; keeping the logic in a
# library keeps the door open for the mobile entry point and for unit tests.
[lib]
name = "dsh_phl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: the window/taskbar icon is picked from the generated PNG ladder at
# the display's scale factor (see apply_taskbar_icon in lib.rs).
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
# In-app updates: the updater verifies a minisign signature against the pubkey
# in tauri.conf.json before installing; process is only needed to relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 实例 dsh-home/settings.yaml 的读-合并-写（api_config）
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
# `WebviewUrl::External` speaks `url::Url`; the crate is already in the graph
# via reqwest, this just makes it a direct dependency of the webui module.
url = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
futures-util = "0.3"
tar = "0.4"
flate2 = "1"
# Node 的 Windows 发行包是 .zip（其余平台是 .tar.gz），运行时安装两边都要能解。
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
semver = "1"
dirs = "5"
fs2 = "0.4"
# Session migration (P1-1): DSH persists session logs as `<session>.jsonl.zstd`
# — one checksummed Zstandard frame per append batch. Reading needs a decoder
# and writing the re-identified header needs an encoder, so PHL handles the
# frames natively. `ruzstd` (pure Rust) decodes DSH's frames; `zstd` encodes,
# and its output was verified to decompress under Node's `zlib.zstdDecompressSync`
# — the exact decoder the running DSH uses — so a copied session still boots.
ruzstd = "0.8.2"
zstd = "0.14.0"
# `.phlpack` format (P2-1): schema, validator, integrity, builder and unpack
# live in a host-free crate shared with the `phl-pack` CLI — the desktop app
# and the DSH Skill can never drift into two implementations of the format.
phl-pack-core = { path = "crates/phl-pack-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
