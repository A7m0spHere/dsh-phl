<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">程序文件共享，实例状态隔离</title>
  <desc id="desc">概念示意：集中存放的 DSH 版本与 Node 运行时被实例 A、B 分别引用。两个实例各自保存 DSH_HOME、配置与插件，并通过不同端口启动各自的 WebUI。</desc>
  <rect width="1200" height="640" rx="10" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, sans-serif">
    <text x="56" y="72" font-size="42" font-weight="600" fill="#171E2B">程序文件共享，实例状态隔离</text>
    <text x="1144" y="68" text-anchor="end" font-size="20" fill="#596579">概念示意</text>
    <g id="shared-files">
      <rect x="56" y="108" width="1088" height="104" rx="8" fill="#F0F3FF"/>
      <text x="88" y="172" font-size="36" font-weight="600" fill="#295DB3">DSH 版本库 + Node 运行时库</text>
      <text x="1108" y="171" text-anchor="end" font-size="26" fill="#596579">实例按需引用</text>
      <path d="M316 213v43m568-43v43" fill="none" stroke="#295DB3" stroke-width="2"/>
      <path d="m309 249 7 9 7-9m554 0 7 9 7-9" fill="none" stroke="#295DB3" stroke-width="2"/>
    </g>
    <g id="instance-a">
      <rect x="56" y="268" width="520" height="228" rx="10" fill="#FFFFFF" stroke="#C5D0E2"/>
      <text x="88" y="326" font-size="40" font-weight="600" fill="#171E2B">实例 A</text>
      <text x="88" y="386" font-family="Consolas, monospace" font-size="34" fill="#295DB3">DSH_HOME / A</text>
      <text x="88" y="452" font-size="34" fill="#596579">独立配置 · 独立插件</text>
      <path d="M316 497v35m-7-7 7 9 7-9" fill="none" stroke="#295DB3" stroke-width="2"/>
      <text x="316" y="584" text-anchor="middle" font-size="34" font-weight="600" fill="#171E2B">端口 A → WebUI A</text>
    </g>
    <g id="instance-b">
      <rect x="624" y="268" width="520" height="228" rx="10" fill="#FFFFFF" stroke="#C5D0E2"/>
      <text x="656" y="326" font-size="40" font-weight="600" fill="#171E2B">实例 B</text>
      <text x="656" y="386" font-family="Consolas, monospace" font-size="34" fill="#295DB3">DSH_HOME / B</text>
      <text x="656" y="452" font-size="34" fill="#596579">独立配置 · 独立插件</text>
      <path d="M884 497v35m-7-7 7 9 7-9" fill="none" stroke="#295DB3" stroke-width="2"/>
      <text x="884" y="584" text-anchor="middle" font-size="34" font-weight="600" fill="#171E2B">端口 B → WebUI B</text>
    </g>
  </g>
</svg>
