<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="592" viewBox="0 0 1200 592" role="img" aria-labelledby="title desc">
  <title id="title">共享版本与运行时，独立保存实例状态</title>
  <desc id="desc">受管实例概念示意：DSH 版本与 Node 运行时集中存放，供实例分别引用。日常实例和测试实例各自保存 DSH_HOME、配置、插件与工作目录，通过不同端口打开各自的 WebUI。这是数据目录隔离，不是操作系统安全沙箱。</desc>
  <rect width="1200" height="592" rx="10" fill="#F4F6FB"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, sans-serif">
    <text x="56" y="70" font-size="36" font-weight="650" fill="#171E2B">程序共享，状态各自保存</text>
    <text x="1144" y="67" text-anchor="end" font-size="20" fill="#596579">受管实例 · 概念示意</text>
    <g id="shared-programs">
      <rect x="56" y="106" width="1088" height="90" rx="8" fill="#FFFFFF"/>
      <text x="88" y="163" font-size="30" font-weight="600" fill="#171E2B">DSH 版本库</text>
      <text x="408" y="163" font-size="30" font-weight="600" fill="#171E2B">Node 运行时库</text>
      <text x="1112" y="161" text-anchor="end" font-size="24" fill="#596579">实例分别选择与引用</text>
      <path d="M320 196v54m560-54v54" fill="none" stroke="#4D6BFE" stroke-width="2"/>
      <path d="m313 240 7 10 7-10 M873 240l7 10 7-10" fill="none" stroke="#4D6BFE" stroke-width="2"/>
    </g>
    <g id="daily-instance">
      <rect x="56" y="258" width="528" height="222" rx="10" fill="#FFFFFF"/>
      <text x="88" y="312" font-size="34" font-weight="600" fill="#171E2B">日常实例</text>
      <text x="88" y="365" font-size="28" font-family="Consolas, monospace" fill="#4D6BFE">DSH_HOME / A</text>
      <path d="M88 391h464" stroke="#E1E6EF"/>
      <text x="88" y="439" font-size="28" fill="#596579">配置 · 插件 · 工作目录</text>
      <path d="M320 480v30m-7-10 7 10 7-10" fill="none" stroke="#4D6BFE" stroke-width="2"/>
      <text x="320" y="549" text-anchor="middle" font-size="28" font-weight="600" fill="#171E2B">端口 A → WebUI A</text>
    </g>
    <g id="test-instance">
      <rect x="616" y="258" width="528" height="222" rx="10" fill="#FFFFFF"/>
      <text x="648" y="312" font-size="34" font-weight="600" fill="#171E2B">测试实例</text>
      <text x="648" y="365" font-size="28" font-family="Consolas, monospace" fill="#4D6BFE">DSH_HOME / B</text>
      <path d="M648 391h464" stroke="#E1E6EF"/>
      <text x="648" y="439" font-size="28" fill="#596579">配置 · 插件 · 工作目录</text>
      <path d="M880 480v30m-7-10 7 10 7-10" fill="none" stroke="#4D6BFE" stroke-width="2"/>
      <text x="880" y="549" text-anchor="middle" font-size="28" font-weight="600" fill="#171E2B">端口 B → WebUI B</text>
    </g>
  </g>
</svg>
