<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="416" viewBox="0 0 1200 416" role="img" aria-labelledby="title desc">
  <title id="title">PHL — 一个桌面，各自的 DSH 环境</title>
  <desc id="desc">DeepSeek Harness 实例与运行时管理器。以三个独立的实例分区展示日常使用、插件测试和版本尝鲜，每个实例分别选择版本、运行时和配置。右侧为用途示意，并非应用截图。</desc>
  <!-- Palette: cool canvas #F4F6FB, ink #171E2B, brand #4D6BFE, muted #596579. -->
  <!-- The existing icon is embedded unchanged. Edit its master and run npm run icon to change it. -->
  <!-- Re-render hero.png from this SVG after edits; PNG keeps the embedded icon portable on GitHub. -->
  <rect width="1200" height="416" rx="10" fill="#F4F6FB"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, sans-serif">
    <g id="identity">
      <image x="46" y="26" width="84" height="84" href="data:image/png;base64,"/>
      <text x="140" y="94" font-size="68" font-weight="700" letter-spacing="-3" fill="#171E2B">PHL</text>
      <text x="56" y="184" font-size="48" font-weight="650" fill="#171E2B">一个桌面，</text>
      <text x="56" y="250" font-size="48" font-weight="650" fill="#171E2B">各自的 <tspan fill="#4D6BFE">DSH</tspan> 环境。</text>
      <text x="56" y="308" font-size="24" fill="#596579">DeepSeek Harness 实例与运行时管理器</text>
      <path d="M56 352h48" stroke="#4D6BFE" stroke-width="3"/>
      <text x="120" y="360" font-size="21" fill="#596579">版本共存 · 配置独立 · 按需启动</text>
    </g>
    <g id="instance-scenarios">
      <rect x="682" y="40" width="462" height="100" rx="10" fill="#4D6BFE"/>
      <text x="710" y="83" font-size="29" font-weight="600" fill="#FFFFFF">日常使用</text>
      <text x="710" y="116" font-size="21" fill="#FFFFFF">保留熟悉的版本与配置</text>
      <text x="1116" y="84" text-anchor="end" font-size="22" font-family="Consolas, monospace" fill="#FFFFFF">01</text>
      <rect x="682" y="156" width="462" height="100" rx="10" fill="#FFFFFF"/>
      <text x="710" y="199" font-size="29" font-weight="600" fill="#171E2B">插件测试</text>
      <text x="710" y="232" font-size="21" fill="#596579">在独立实例里调整与试验</text>
      <text x="1116" y="200" text-anchor="end" font-size="22" font-family="Consolas, monospace" fill="#4D6BFE">02</text>
      <rect x="682" y="272" width="462" height="100" rx="10" fill="#FFFFFF"/>
      <text x="710" y="315" font-size="29" font-weight="600" fill="#171E2B">版本尝鲜</text>
      <text x="710" y="348" font-size="21" fill="#596579">新旧 DSH 环境并存</text>
      <text x="1116" y="316" text-anchor="end" font-size="22" font-family="Consolas, monospace" fill="#4D6BFE">03</text>
    </g>
  </g>
</svg>
