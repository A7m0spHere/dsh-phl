<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-labelledby="title desc">
  <title id="title">PHL — 多个 DSH 版本并存，每个实例独立配置</title>
  <desc id="desc">白底蓝色的标题板，展示项目现有的鲸鱼尾鳍 Logo。PHL 是 Windows 上的 DeepSeek Harness 实例与运行时管理器；下方两个分开的区块代表独立实例。</desc>
  <rect width="1200" height="336" rx="10" fill="#FFFFFF"/>

  <!-- Editable source for hero.png; re-render the PNG after changing this SVG. -->
  <!-- Existing logo, unmodified bytes from src-tauri/icons/128x128@2x.png. Regenerate from the icon master with npm run icon. -->
  <image x="48" y="88" width="136" height="136" href="data:image/png;base64,"/>
  <g id="identity" font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, sans-serif">
    <text x="56" y="65" font-size="22" letter-spacing="2" fill="#596579">DEEPSEEK HARNESS</text>
    <text x="194" y="190" font-size="108" font-weight="700" letter-spacing="-3" fill="#171E2B">PHL</text>
    <text x="504" y="140" font-size="46" font-weight="600" fill="#171E2B">多个 DSH 版本并存</text>
    <text x="504" y="210" font-size="46" font-weight="600" fill="#171E2B">每个实例，独立配置</text>
  </g>
  <g id="instance-boundaries" font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, sans-serif" font-size="23">
    <rect x="56" y="263" width="326" height="42" rx="4" fill="#F0F3FF"/>
    <text x="76" y="292" fill="#3651C7">实例与运行时管理器</text>
    <path d="M424 263v42h330v-42 M784 263v42h360v-42" fill="none" stroke="#4D6BFE" stroke-width="2"/>
    <text x="449" y="291" fill="#596579">日常使用</text>
    <text x="809" y="291" fill="#596579">插件测试 / 版本尝鲜</text>
  </g>
</svg>
