name: Release

# Tag-triggered release pipeline (T-207). CI gates every commit; this adds
# the Windows NSIS bundle, artifact hashing and a GitHub Release. Alpha
# builds are published as prereleases; the updater (T-208) deliberately
# waits until this pipeline is stable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Windows NSIS bundle + GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tag must name the version the app reports; a mismatched tag would
      # publish an installer whose about-dialog disagrees with its filename.
      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $expected = "v" + $conf.version
          $actual = "${{ github.ref_name }}"
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $actual -ne $expected) {
            Write-Error "tag $actual does not match tauri.conf.json version $expected"
            exit 1
          }

      - name: Run test suites
        shell: bash
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - run: npm run app:build
        shell: bash

      - name: Hash artifacts (SHA256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $line = "$hash  $($_.Name)"
            $line | Tee-Object -FilePath ("dist-release/" + $_.Name + ".sha256")
            Copy-Item $_.FullName dist-release/
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Alpha line publishes as prerelease until 0.1.0 proper.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist-release/*
