name: Release

# Tag-triggered release pipeline (T-207). CI gates every commit; this adds
# the Windows NSIS bundle, artifact hashing and a GitHub Release. Alpha
# builds are published as prereleases; the updater (T-208) deliberately
# waits until this pipeline is stable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Windows NSIS bundle + GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tag must name the version the app reports; a mismatched tag would
      # publish an installer whose about-dialog disagrees with its filename.
      # The three version sources must also agree with each other, so a
      # manually dispatched build cannot mix versions either.
      - name: Verify versions (package.json · Cargo.toml · tauri.conf.json · tag)
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $crate = (cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq "dsh-phl" } |
            Select-Object -ExpandProperty version
          if ($pkg -ne $conf -or $crate -ne $conf) {
            Write-Error "version mismatch: package.json=$pkg Cargo.toml=$crate tauri.conf.json=$conf"
            exit 1
          }
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $expected = "v" + $conf
            $actual = "${{ github.ref_name }}"
            if ($actual -ne $expected) {
              Write-Error "tag $actual does not match app version $expected"
              exit 1
            }
          }

      - run: npm test
        shell: bash

      # Build the frontend before the Rust checks: a broken frontend then
      # fails in seconds instead of after minutes of Rust compilation, and
      # the bundle step later finds dist already in place.
      - run: npm run build
        shell: bash

      - run: cargo test
        shell: bash
        working-directory: src-tauri

      # A fresh checkout must carry every bundle input; fail here, naming the
      # missing file, instead of deep inside NSIS packaging.
      - name: Check bundle inputs (icons)
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          foreach ($icon in $conf.bundle.icon) {
            $path = Join-Path "src-tauri" $icon
            if (-not (Test-Path $path)) {
              Write-Error "missing bundle input: $path"
              exit 1
            }
          }

      - run: npm run app:build
        shell: bash

      - name: Hash artifacts (SHA256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $line = "$hash  $($_.Name)"
            $line | Tee-Object -FilePath ("dist-release/" + $_.Name + ".sha256")
            Copy-Item $_.FullName dist-release/
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Alpha line publishes as prerelease until 0.1.0 proper.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist-release/*
