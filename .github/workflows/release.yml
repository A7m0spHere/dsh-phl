name: Release

# Tag-triggered release pipeline (T-207). CI gates every commit; this adds
# the Windows NSIS bundle, artifact hashing and a GitHub Release. Alpha
# builds are published as prereleases; the updater (T-208) deliberately
# waits until this pipeline is stable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Windows NSIS bundle + GitHub Release
    runs-on: windows-latest
    env:
      # `secrets` cannot be read inside an `if:`, so the one condition the
      # steps need is computed here and switched on by name below.
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tag must name the version the app reports; a mismatched tag would
      # publish an installer whose about-dialog disagrees with its filename.
      # The five version files must also agree with each other, so a manually
      # dispatched build cannot mix versions either. Same script as the gate:
      # one definition of "consistent", checked before the build is paid for.
      - name: Verify versions (package + lock · Cargo + lock · tauri.conf.json · tag)
        shell: bash
        env:
          PHL_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: node scripts/check-versions.mjs

      - run: npm test
        shell: bash

      # Build the frontend before the Rust checks: a broken frontend then
      # fails in seconds instead of after minutes of Rust compilation, and
      # the bundle step later finds dist already in place.
      - run: npm run build
        shell: bash

      # Match the CI Rust gate's scope: `--workspace` so the release build
      # exercises Pack Core and the CLI too, not just the root crate (§R2).
      - run: cargo test --workspace
        shell: bash
        working-directory: src-tauri

      # A fresh checkout must carry every bundle input; fail here, naming the
      # missing file, instead of deep inside NSIS packaging.
      - name: Check bundle inputs (icons)
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          foreach ($icon in $conf.bundle.icon) {
            $path = Join-Path "src-tauri" $icon
            if (-not (Test-Path $path)) {
              Write-Error "missing bundle input: $path"
              exit 1
            }
          }

      # Signing is opt-in: the step is skipped unless the repository variable
      # WINDOWS_SIGNING is set to "true", and the certificate itself only ever
      # exists as a secret. PHL_SIGN_REQUIRED makes a half-configured release
      # fail here instead of publishing an unsigned installer.
      - name: Configure Windows signing (skipped unless enabled)
        if: ${{ vars.WINDOWS_SIGNING == 'true' }}
        shell: pwsh
        run: |
          "PHL_SIGN_PFX_BASE64=${{ secrets.WINDOWS_CERTIFICATE }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PHL_SIGN_PFX_PASSWORD=${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PHL_SIGN_REQUIRED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows signing configured"

      # The signing key turns on updater artifacts (latest.json + .sig). It is
      # passed through a merge config rather than the base one: with
      # createUpdaterArtifacts on, a build without the key fails outright, and
      # contributors building locally have no key.
      - name: Configure updater signing
        if: env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        run: |
          "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "updater signing configured"

      - name: Build installer (no updater manifest)
        if: env.HAS_SIGNING_KEY != 'true'
        shell: bash
        run: |
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set - this release will have no updater manifest, so installed copies cannot auto-update to it."
          npm run app:build

      - name: Build installer with updater artifacts
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: npx tauri build --config src-tauri/tauri.updater.conf.json

      - name: Hash artifacts (SHA256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          # The updater manifest and its signature ship with the release too, so
          # the same bytes that installed copies verify are publicly inspectable.
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.json, src-tauri/target/release/bundle/nsis/*.sig -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist-release/ }
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $line = "$hash  $($_.Name)"
            $line | Tee-Object -FilePath ("dist-release/" + $_.Name + ".sha256")
            Copy-Item $_.FullName dist-release/
          }

      # ── Release gates ────────────────────────────────────────────────────
      # Everything above produced bytes; everything below proves those bytes
      # behave on a clean Windows machine BEFORE a Release exists and before
      # the updater manifest points any installed app at them. A failing gate
      # publishes nothing. (docs/windows-e2e-release-gate.md)
      - name: E2E gate — headless journeys & fault injection
        shell: bash
        working-directory: src-tauri
        run: cargo test --workspace -- --ignored release_e2e --test-threads=1

      - name: E2E gate — installer smoke (install · launch · upgrade · uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node e2e/install-smoke.mjs --installer=$($setup.FullName) --expect-version=$version --out=e2e-report

      - name: Upload the gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-release-gate
          path: e2e-report
          if-no-files-found: warn

      # The CLI signs the installer (.sig) but does not write latest.json - that
      # is tauri-action's job. Building it here keeps the pipeline hand-rolled:
      # the manifest is derived from the version, the release notes and the
      # signature of the artifact this very run produced.
      - name: Build the updater manifest
        if: env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $sig = Get-ChildItem src-tauri/target/release/bundle/nsis/*.sig | Select-Object -First 1
          if (-not $sig) { Write-Error "the build produced no .sig - was the signing key accepted?"; exit 1 }
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)"
          $manifest = [ordered]@{
            version = $version
            notes = (Get-Content docs/release-notes.md -Raw).Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url = $url
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText("dist-release/latest.json", $json, (New-Object Text.UTF8Encoding($false)))
          Write-Host "manifest: $version -> $url"
      # The body is composed here rather than at author time: docs/release-notes.md
      # is written per release, docs/install-note.md is stable, and GitHub
      # prepends whatever we pass to the generated changelog.
      - name: Compose the release body
        shell: pwsh
        run: |
          # Written outside dist-release on purpose: everything in that folder
          # is uploaded as a release asset, and the composed body is not one.
          $target = Join-Path $env:RUNNER_TEMP 'release-body.md'
          $notes = Get-Content docs/release-notes.md -Raw
          $install = Get-Content docs/install-note.md -Raw
          $sep = [char]10 + [char]10
          [IO.File]::WriteAllText($target, $notes + $sep + $install, (New-Object Text.UTF8Encoding($false)))
          Write-Host "release body lines: $((Get-Content $target).Count)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Alpha line publishes as prerelease until 0.1.0 proper.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The composed body comes first: GitHub prepends it to the generated
          # changelog, so readers see what changed and how to verify the
          # download before the raw commit list.
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: true
          files: dist-release/*

      # The updater needs a stable URL, and `releases/latest/download/latest.json`
      # only ever points at the newest non-prerelease - the alpha line is all
      # prereleases. A tiny `updates` branch solves that: one file, no history
      # worth reading, fetched over raw.githubusercontent.com.
      # It runs after the release exists so the manifest never points at an
      # asset that is not uploaded yet.
      - name: Publish the updater manifest
        if: env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path dist-release/latest.json)) { Write-Host "no manifest in this run"; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'phl-updates'
          $url = "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch updates $url $dir 2>$null
          if ($LASTEXITCODE -ne 0) {
            # First release after this step was added: the branch does not exist
            # yet, so create it - and remember to wire the remote, or the push
            # below fails with "'origin' does not appear to be a git repository".
            New-Item -ItemType Directory -Force $dir | Out-Null
            git -C $dir init --quiet
            git -C $dir checkout --quiet -b updates
            git -C $dir remote add origin $url
          }
          Copy-Item dist-release/latest.json (Join-Path $dir 'latest.json') -Force
          git -C $dir config user.name 'github-actions[bot]'
          git -C $dir config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $dir add latest.json
          git -C $dir commit --quiet -m "updates: ${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { Write-Host "manifest unchanged"; exit 0 }
          git -C $dir push origin updates
          Write-Host "published latest.json to the updates branch"
