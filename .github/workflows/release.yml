name: Release

# Tag-triggered release pipeline (T-207). CI gates every commit; this adds
# the Windows NSIS bundle, artifact hashing and a GitHub Release. Alpha
# builds are published as prereleases; the updater (T-208) deliberately
# waits until this pipeline is stable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Windows NSIS bundle + GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tag must name the version the app reports; a mismatched tag would
      # publish an installer whose about-dialog disagrees with its filename.
      # The four version sources must also agree with each other, so a manually
      # dispatched build cannot mix versions either. Same script as the gate:
      # one definition of "consistent", checked before the build is paid for.
      - name: Verify versions (package.json · Cargo.toml · tauri.conf.json · Cargo.lock · tag)
        shell: bash
        env:
          PHL_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: node scripts/check-versions.mjs

      - run: npm test
        shell: bash

      # Build the frontend before the Rust checks: a broken frontend then
      # fails in seconds instead of after minutes of Rust compilation, and
      # the bundle step later finds dist already in place.
      - run: npm run build
        shell: bash

      # Match the CI Rust gate's scope: `--workspace` so the release build
      # exercises Pack Core and the CLI too, not just the root crate (§R2).
      - run: cargo test --workspace
        shell: bash
        working-directory: src-tauri

      # A fresh checkout must carry every bundle input; fail here, naming the
      # missing file, instead of deep inside NSIS packaging.
      - name: Check bundle inputs (icons)
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          foreach ($icon in $conf.bundle.icon) {
            $path = Join-Path "src-tauri" $icon
            if (-not (Test-Path $path)) {
              Write-Error "missing bundle input: $path"
              exit 1
            }
          }

      # Signing is opt-in: the step is skipped unless the repository variable
      # WINDOWS_SIGNING is set to "true", and the certificate itself only ever
      # exists as a secret. PHL_SIGN_REQUIRED makes a half-configured release
      # fail here instead of publishing an unsigned installer.
      - name: Configure Windows signing (skipped unless enabled)
        if: ${{ vars.WINDOWS_SIGNING == 'true' }}
        shell: pwsh
        run: |
          "PHL_SIGN_PFX_BASE64=${{ secrets.WINDOWS_CERTIFICATE }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PHL_SIGN_PFX_PASSWORD=${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PHL_SIGN_REQUIRED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows signing configured"

      - run: npm run app:build
        shell: bash

      - name: Hash artifacts (SHA256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $line = "$hash  $($_.Name)"
            $line | Tee-Object -FilePath ("dist-release/" + $_.Name + ".sha256")
            Copy-Item $_.FullName dist-release/
          }

      # The body is composed here rather than at author time: docs/release-notes.md
      # is written per release, docs/install-note.md is stable, and GitHub
      # prepends whatever we pass to the generated changelog.
      - name: Compose the release body
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $notes = Get-Content docs/release-notes.md -Raw
          $install = Get-Content docs/install-note.md -Raw
          $sep = [char]10 + [char]10
          [IO.File]::WriteAllText("dist-release/release-body.md", $notes + $sep + $install, (New-Object Text.UTF8Encoding($false)))
          Write-Host "release body lines: $((Get-Content dist-release/release-body.md).Count)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Alpha line publishes as prerelease until 0.1.0 proper.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The composed body comes first: GitHub prepends it to the generated
          # changelog, so readers see what changed and how to verify the
          # download before the raw commit list.
          body_path: dist-release/release-body.md
          generate_release_notes: true
          files: dist-release/*
