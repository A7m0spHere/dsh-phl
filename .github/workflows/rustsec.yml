name: RustSec

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit
        id: cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-audit-0.22.2

      - name: Install cargo-audit
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked

      # Fetch the current advisory database and inspect every target in the
      # committed workspace lockfile. Vulnerabilities fail the gate; existing
      # unmaintained-package notices remain visible without blanket ignores.
      - name: Audit the workspace lockfile
        working-directory: src-tauri
        run: cargo audit --file Cargo.lock
