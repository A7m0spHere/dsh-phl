name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cheap and decisive: a half-applied version bump must never reach a
      # release, and this is the same script the release workflow runs.
      - run: node scripts/check-versions.mjs

      # Ratchet size budget (rule recorded in scripts/file-size-budget.json): big files may
      # not grow past their registered ceilings; shrinks ratchet down via
      # `node scripts/check-file-size.mjs --update`.
      - run: node scripts/check-file-size.mjs

      # Publication boundary: the published tree carries code only. Planning,
      # review and acceptance notes live in the maintainer's local workspace.
      - run: node scripts/check-public-boundary.mjs

      - run: npm run typecheck

      - run: npm run bridge:check

      - run: npm test

      - run: node --test scripts/test-alpha-desktop.mjs

      # The build doubles as the `dist/` the Rust job needs: tauri's
      # `generate_context!` reads ../dist at compile time.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  rust:
    name: Rust (fmt · clippy · test · check)
    runs-on: windows-latest
    needs: frontend
    # The manifest lives in src-tauri/, not at the repo root; only the `run`
    # steps below are affected — `uses:` steps keep the workspace root.
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 on Windows compiles against WebView2 with no extra system
      # packages, so the Windows-first crate checks on a Windows runner.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The manifest at src-tauri/ is a NON-virtual workspace (root crate +
      # phl-pack-core + phl-pack-cli) with no `default-members`, so a bare
      # `cargo test`/`check` silently runs only the root crate and never the
      # extracted Pack Core or CLI. Every gate below is scoped to `--workspace`
      # / `--all` so all three crates are actually exercised (§R2).
      - run: cargo fmt --all -- --check
        shell: bash

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        shell: bash

      - run: cargo test --workspace
        shell: bash

      - run: cargo check --workspace
        shell: bash

  # The headless Windows E2E lane: the real install→launch→adopt→snapshot→
  # pack→migrate journeys plus system-level fault injection (force-kill,
  # download abort/resume, locked destination, late exit), all against mock
  # registries on a throwaway data root. `--test-threads=1` is load-bearing:
  # the cases bind real sockets and spawn real children.
  # ~6 min including the compile; the installer lane runs on top of it in
  # release.yml / dispatch (gate boundaries live in maintainer-local docs).
  windows-e2e:
    name: Windows E2E (journeys · fault injection)
    runs-on: windows-latest
    needs: [frontend, rust]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # The gate's fake Node runtime IS the host's node: the health check
      # runs the installed binary, so node must be present (it is, via
      # setup-node) and on PATH for `node --version` probing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo test --workspace -- --ignored release_e2e --test-threads=1
        shell: bash

  # Full NSIS bundle is the slowest step and not required per-commit; it runs
  # on demand only. Official releases go through release.yml (tag-triggered),
  # which builds and publishes separately — CI never builds for a tag.
  tauri-build:
    name: Windows bundle
    runs-on: windows-latest
    needs: [frontend, rust]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm run app:build
        shell: bash

      # The dispatch build is also the installer-lane rehearsal: run the OS
      # smoke (silent install → upgrade → uninstall) against the exact bundle
      # the job produced, before it is uploaded. --no-gui: a hosted runner
      # cannot open WebView2's DevTools port, so the renderer trio lives in
      # the manual desktop lane (gate boundaries live in maintainer-local docs).
      - name: Installer smoke (hosted lane)
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node e2e/install-smoke.mjs --installer=$($setup.FullName) --expect-version=$version --out=e2e-report --no-gui
        env:
          PHL_SMOKE_KEEP: "0"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-report
          path: e2e-report
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
